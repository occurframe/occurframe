[workspace]
resolver = "2"
members = [
    "crates/occurframe-wire",
    "crates/occurframe-conformance",
    "crates/occurframe-runner",
    "crates/occurframe-report",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/occurframe/occurframe"
rust-version = "1.85"

[workspace.dependencies]
hex = "0.4.3"
jsonschema = { version = "0.33.0", default-features = false }
occurframe-conformance = { path = "crates/occurframe-conformance" }
occurframe-report = { path = "crates/occurframe-report" }
occurframe-runner = { path = "crates/occurframe-runner" }
occurframe-wire = { path = "crates/occurframe-wire" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.12"
walkdir = "2.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
