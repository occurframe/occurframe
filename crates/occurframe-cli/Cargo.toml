[package]
name = "occurframe-cli"
description = "Shared implementation behind the occurframe and oframe conformance clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "occurframe_cli"

[[bin]]
name = "occurframe"
path = "src/bin/occurframe.rs"

[[bin]]
name = "oframe"
