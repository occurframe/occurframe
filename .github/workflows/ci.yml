name: Fast correctness CI

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      OCCURFRAME_TEST_CORPUS: ${{ github.workspace }}/corpus-authority
    steps:
      - uses: actions/checkout@v4
      - name: Check out immutable RC2 authority
        uses: actions/checkout@v4
        with:
          repository: occurframe/corpus
          ref: f5026940fcc667b1892e99f3abe95b424931bed0
          path: corpus-authority
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Verify bundled-corpus identity and deterministic pack
        run: cargo run --locked -p xtask -- verify-deterministic --corpus corpus-authority
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The clean-room suite proves the same properties about a packaged
      # release, but it needs certified evidence and cannot run on a pull
      # request. This is the cheap equivalent: alias equivalence, deterministic
      # text/JSON/JUnit output and the protocol path, against a locally packed
      # corpus and the shipped example runner.
      - name: Protocol example smoke (aliases, determinism, exit domains)
        shell: bash
        run: |
          cargo build --locked -p occurframe-cli --bins
          cargo run --locked -p xtask -- pack --corpus corpus-authority --output packed-corpus
          mkdir -p packed-corpus/schemas
          cp corpus-authority/schemas/runner-protocol-v2.schema.json packed-corpus/schemas/
          suffix=""
          if [ "${RUNNER_OS}" = "Windows" ]; then suffix=".exe"; fi
          python tests/example-runner/smoke.py \
            --occurframe "target/debug/occurframe${suffix}" \
            --oframe "target/debug/oframe${suffix}" \
            --corpus packed-corpus
      # Generated inventories must be reproducible from the workspace itself.
      - name: Dependency and licence inventory generation
        run: cargo run --locked -p xtask -- dependency-inventory --manifest Cargo.toml --output dependencies.json --notices third-party-notices.md
      - name: Documentation (Unix)
        if: runner.os != 'Windows'
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - name: Documentation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: $env:RUSTDOCFLAGS='-D warnings'; cargo doc --workspace --no-deps
