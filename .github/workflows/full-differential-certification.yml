name: Full Differential Certification

on:
  workflow_dispatch:

# Manual authority workflow. It never publishes a release or rewrites the
# durable measurement; it proves a requested tooling commit against that lock.

concurrency:
  group: rc3-full-differential-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    name: Ubuntu 24.04 x86_64 canonical evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check out corrected RC3 authority
        uses: actions/checkout@v4
        with:
          repository: occurframe/corpus
          ref: cd6569c9f57c9eb8f087f1a18c08f23baa747bde
          path: corpus

      # This is a separately attributed, read-only authority checkout. It is
      # excluded from the tooling status check and from the Docker build
      # context; certify.ps1 verifies its own Git status and revision.
      - name: Isolate corpus checkout from tooling source identity
        shell: bash
        run: echo /corpus/ >> .git/info/exclude

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate corpus authority before measurement
        run: cargo run --locked -p xtask -- validate --corpus corpus

      - name: Build canonical pinned certification image
        shell: pwsh
        run: >-
          ./certification/docker/certify.ps1
          -Action build
          -CorpusPath ./corpus

      - name: Run and verify two complete offline certifications
        shell: pwsh
        run: >-
          ./certification/docker/certify.ps1
          -Action run
          -CorpusPath ./corpus
          -Script certification/docker/tasks/full-certification.sh

      # The canonical container runs as root and writes through a bind mount.
      # Return only the generated output tree to the hosted runner account so
      # subsequent deterministic reconciliation can add its checked artifact.
      - name: Transfer generated evidence ownership
        shell: bash
        run: sudo chown -R "$(id -u):$(id -g)" dist/certification

      - name: Restore locked RC2 and RC3 evidence
        shell: bash
        run: |
          cargo run --locked -p xtask -- verify-evidence-archive \
            --root . --lock release/evidence-lock-rc2.json
          cargo run --locked -p xtask -- verify-evidence-archive \
            --root . --lock release/evidence-lock.json
          mkdir -p dist/certification/locked
          tar -xzf certification/rc2-evidence.tar.gz -C dist/certification/locked
          tar -xzf certification/rc3-evidence.tar.gz -C dist/certification/locked
          cargo run --locked -p xtask -- verify-evidence-archive \
            --root . --lock release/evidence-lock-rc2.json \
            --extracted dist/certification/locked/rc2
          cargo run --locked -p xtask -- verify-evidence-archive \
            --root . --lock release/evidence-lock.json \
            --extracted dist/certification/locked/rc3

      - name: Reconcile RC2 to this RC3 execution
        shell: bash
        run: |
          for current in rc3 rc3-rerun; do
            cargo run --locked -p xtask -- reconcile-certifications \
              --previous dist/certification/locked/rc2 \
              --current "dist/certification/${current}" \
              --expected-correction CRON-DST-001 \
              --expected-correction CRON-DST-020 \
              --metadata-only-correction CRON-DST-015 \
              --output "dist/certification/${current}/rc2-rc3-reconciliation.json"
            cargo run --locked -p xtask -- checksums \
              --root "dist/certification/${current}" \
              --output "dist/certification/${current}/SHA256SUMS"
            cargo run --locked -p xtask -- certification-verify \
              --directory "dist/certification/${current}"
          done
          cmp dist/certification/rc3/rc2-rc3-reconciliation.json \
              dist/certification/rc3-rerun/rc2-rc3-reconciliation.json

      - name: Match the durable RC3 measurement
        shell: bash
        run: |
          locked=dist/certification/locked/rc3
          current=dist/certification/rc3
          cmp "$locked/observations.ndjson" "$current/observations.ndjson"
          cmp "$locked/conformance-results.ndjson" "$current/conformance-results.ndjson"
          cmp "$locked/matrix.csv" "$current/matrix.csv"
          cmp "$locked/reconciliation.json" "$current/reconciliation.json"
          cmp "$locked/reconciliation.md" "$current/reconciliation.md"
          jq 'del(.tooling_source_revision, .tooling_source_revision_method)' \
            "$locked/matrix.json" > /tmp/locked-matrix.json
          jq 'del(.tooling_source_revision, .tooling_source_revision_method)' \
            "$current/matrix.json" > /tmp/current-matrix.json
          cmp /tmp/locked-matrix.json /tmp/current-matrix.json
          sed -E '/Tooling source revision:/ s/[0-9a-f]{40}/<tooling-source>/' \
            "$locked/differential-report.md" > /tmp/locked-report.md
          sed -E '/Tooling source revision:/ s/[0-9a-f]{40}/<tooling-source>/' \
            "$current/differential-report.md" > /tmp/current-report.md
          cmp /tmp/locked-report.md /tmp/current-report.md
          jq 'del(.current_certification.tooling_source_revision, .current_certification.semantic_bundle_digest)' \
            "$locked/rc2-rc3-reconciliation.json" > /tmp/locked-rc2-rc3.json
          jq 'del(.current_certification.tooling_source_revision, .current_certification.semantic_bundle_digest)' \
            "$current/rc2-rc3-reconciliation.json" > /tmp/current-rc2-rc3.json
          cmp /tmp/locked-rc2-rc3.json /tmp/current-rc2-rc3.json

      - name: Publish concise certification summary
        shell: bash
        run: |
          matrix=dist/certification/rc3/matrix.json
          reconciliation=dist/certification/rc3/reconciliation.json
          determinism=dist/certification/determinism.json
          {
            echo "## RC3 authority-boundary differential certification"
            echo
            echo "- Tooling SHA: \`${GITHUB_SHA}\`"
            echo "- Corpus source revision: \`$(jq -r '.corpus_source_revision' "$matrix")\`"
            echo "- Corpus canonical digest: \`$(jq -r '.corpus_canonical_digest' "$matrix")\`"
            echo "- Observations: $(jq -r '.summary.actual_observations' "$matrix")"
            echo "- Semantic divergence vectors: $(jq -r '.summary.semantic_divergence_vectors' "$matrix")"
            echo "- Normative violation vectors: $(jq -r '.summary.normative_violation_vectors' "$matrix")"
            echo "- Unsupported cells: $(jq -r '.summary.outcome_counts.unsupported // 0' "$matrix")"
            echo "- Engine errors: $(jq -r '.summary.outcome_counts.engine_error // 0' "$matrix")"
            echo "- Timeouts: $(jq -r '.summary.outcome_counts.timeout // 0' "$matrix")"
            echo "- Runner failures: $(jq -r '.summary.outcome_counts.runner_failure // 0' "$matrix")"
            echo "- RC1 ambiguous-error inventory: $(jq -r '.legacy_ambiguous_error_inventory' "$reconciliation")"
            echo "- RC2 → RC3 unresolved cells: $(jq -r '.unresolved' dist/certification/rc3/rc2-rc3-reconciliation.json)"
            echo "- Deterministic byte equality: $(jq -r '.byte_equal' "$determinism")"
            echo "- Semantic digest: \`$(jq -r '.first_digest' "$determinism")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload canonical certification evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: occurframe-rc3-certification-${{ github.sha }}
          path: |
            dist/certification/rc3/
            dist/certification/determinism.json
          if-no-files-found: error
          retention-days: 90
