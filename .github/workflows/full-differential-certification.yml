name: Full Differential Certification

on:
  workflow_dispatch:

# Preparation only: this workflow is intentionally manual until the owner starts
# the subsequent clean recertification task.

concurrency:
  group: rc3-full-differential-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    name: Ubuntu 24.04 x86_64 canonical evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check out corrected RC3 authority
        uses: actions/checkout@v4
        with:
          repository: occurframe/corpus
          ref: cf45a0bbcb7bbb1d37e03652d49841ee106bcc6b
          path: corpus

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate corpus authority before measurement
        run: cargo run --locked -p xtask -- validate --corpus corpus

      - name: Build canonical pinned certification image
        shell: pwsh
        run: >-
          ./certification/docker/certify.ps1
          -Action build
          -CorpusPath ./corpus

      - name: Run and verify two complete offline certifications
        shell: pwsh
        run: >-
          ./certification/docker/certify.ps1
          -Action run
          -CorpusPath ./corpus
          -Script certification/docker/tasks/full-certification.sh

      - name: Publish concise certification summary
        shell: bash
        run: |
          matrix=dist/certification/rc3/matrix.json
          reconciliation=dist/certification/rc3/reconciliation.json
          determinism=dist/certification/determinism.json
          {
            echo "## RC3 authority-boundary differential certification"
            echo
            echo "- Tooling SHA: \`${GITHUB_SHA}\`"
            echo "- Corpus source revision: \`$(jq -r '.corpus_source_revision' "$matrix")\`"
            echo "- Corpus canonical digest: \`$(jq -r '.corpus_canonical_digest' "$matrix")\`"
            echo "- Observations: $(jq -r '.summary.actual_observations' "$matrix")"
            echo "- Semantic divergence vectors: $(jq -r '.summary.semantic_divergence_vectors' "$matrix")"
            echo "- Normative violation vectors: $(jq -r '.summary.normative_violation_vectors' "$matrix")"
            echo "- Unsupported cells: $(jq -r '.summary.outcome_counts.unsupported // 0' "$matrix")"
            echo "- Engine errors: $(jq -r '.summary.outcome_counts.engine_error // 0' "$matrix")"
            echo "- Timeouts: $(jq -r '.summary.outcome_counts.timeout // 0' "$matrix")"
            echo "- Runner failures: $(jq -r '.summary.outcome_counts.runner_failure // 0' "$matrix")"
            echo "- RC1 ambiguous-error inventory: $(jq -r '.legacy_ambiguous_error_inventory' "$reconciliation")"
            echo "- Deterministic byte equality: $(jq -r '.byte_equal' "$determinism")"
            echo "- Semantic digest: \`$(jq -r '.first_digest' "$determinism")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload canonical certification evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: occurframe-rc3-certification-${{ github.sha }}
          path: |
            dist/certification/rc3/
            dist/certification/determinism.json
          if-no-files-found: error
          retention-days: 90
